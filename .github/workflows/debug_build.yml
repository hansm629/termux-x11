name: Build

on:
  workflow_dispatch:
    inputs:
      cohost_termux:
        description: 'EXPERIMENT: Run the Termux-X11 Android UI in the com.termux process (shared UID + signing required)'
        required: false
        type: boolean
        default: false
      game_power_mode:
        description: 'EXPERIMENT: Classify non-Cohost Termux:X11 as a GAME for Android Power HAL GAME mode; no extra CPU/GPU work'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'

permissions:
  contents: write
  
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 1
    - name: Validation
      uses: gradle/actions/wrapper-validation@v6
      
    - name: Java setup
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Restore cache
      uses: actions/cache@v5
      with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

          restore-keys: |
            ${{ runner.os }}-gradle-

    - name: Build
      run: |
        if [[ "${{ inputs.game_power_mode }}" == "true" ]]; then
          if [[ "${{ inputs.cohost_termux }}" == "true" ]]; then
            echo 'GAME power mode and cohost cannot be combined'
            exit 1
          fi
          python3 tools/oneui-game-power/category.py enable
        fi
        if [[ "${{ inputs.cohost_termux }}" == "true" ]]; then
          ./gradlew assembleDebug -Ptx11CohostTermux=true
        elif [[ "${{ inputs.game_power_mode }}" == "true" ]]; then
          ./gradlew assembleDebug -Ptx11GamePowerExperiment=true
        else
          ./gradlew assembleDebug
        fi
    - name: Verify process host in merged manifest
      run: |
        if [[ "${{ inputs.cohost_termux }}" == "true" ]]; then
          python3 tools/oneui-cohost/verify-manifest.py com.termux
        else
          python3 tools/oneui-cohost/verify-manifest.py com.termux.x11
        fi
    - name: Verify GAME category in merged manifest
      run: |
        if [[ "${{ inputs.game_power_mode }}" == "true" ]]; then
          python3 tools/oneui-game-power/category.py verify game
        else
          python3 tools/oneui-game-power/category.py verify none
        fi
    - name: Build companion package
      run: ./build_termux_package
    - name: Store app-arm64-v8a-debug
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.game_power_mode && 'termux-x11-arm64-v8a-GAME-POWER-EXPERIMENT' || (inputs.cohost_termux && 'termux-x11-arm64-v8a-COHOST-EXPERIMENT' || 'termux-x11-arm64-v8a-debug') }}
        path: ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
    
    - name: Store app-armeabi-v7a-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-armeabi-v7a-debug
        path: ./app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
    
    - name: Store app-universal-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-universal-debug
        path: ./app/build/outputs/apk/debug/app-universal-debug.apk
    
    - name: Store app-x86_64-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-x86_64-debug
        path: ./app/build/outputs/apk/debug/app-x86_64-debug.apk
    
    - name: Store app-x86-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-x86-debug
        path: ./app/build/outputs/apk/debug/app-x86-debug.apk
    
    - name: Store companion package
      uses: actions/upload-artifact@v7
      with:
        name: termux-companion packages
        path: |
          ./app/build/outputs/apk/debug/termux-x11-*-all.deb
          ./app/build/outputs/apk/debug/termux-x11-*-any.pkg.tar.xz
        
    - name: Store unstripped libraries with debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-unstripped-libraries-for-ndk-stack
        path: ./app/build/intermediates/cxx/Debug/*

    - name: Update Nightly Release
      uses: andelf/nightly-release@main
      if: github.repository == 'termux/termux-x11' && github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nightly
        name: 'Nightly Release $$'
        draft: false
        prerelease: false
        body: |
          This is a nightly release of the termux-x11 app.
          Based on ${{ github.sha }}
        files: |
          ./app/build/outputs/apk/debug/app-*-debug.apk
          ./app/build/outputs/apk/debug/termux-x11-*-all.deb
          ./app/build/outputs/apk/debug/termux-x11-*-any.pkg.tar.xz
